<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Claras: reparte gastos compartidos en viajes, roomies y planes. En tu moneda, sin registro y con tus grupos en tu celular.">

  <!-- PWA / iOS: instalar en pantalla de inicio -->
  <meta name="theme-color" content="#C75432">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Claras">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Claras</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Evita el "flash" blanco al abrir y empareja el fondo con el tema. */
    html, body { margin: 0; background-color: #FBF6F1; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #171210; }
    }
    /* Mientras carga: el logo y un indicador, hasta el primer cuadro. */
    #carga {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    #carga img { width: 96px; height: 96px; border-radius: 22px; }
    #carga .giro {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(199, 84, 50, 0.25);
      border-top-color: #C75432;
      animation: girar 0.9s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="carga" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <div class="giro"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
